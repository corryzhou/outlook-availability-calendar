<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Corry 教练工作日历</title>

  <!-- Fonts: Playfair Display (serif) + DM Sans (sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── CSS Variables (warm beige editorial theme) ── */
    :root {
      --background:    #f5ede0;   /* warm cream */
      --foreground:    #2a1f0f;   /* deep warm brown */
      --border:        #d4c4a8;   /* soft warm border */
      --border-strong: #b0a090;   /* bold separator */
      --muted-fg:      #7a6a55;   /* muted text */
      --accent-bg:     #ede0cc;   /* hover accent */
      --busy:          #9b2c2c;   /* deep red */
      --busy-light:    #fde8e8;   /* light red bg */
      --card:          #faf4ea;   /* card background */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--background);
      color: var(--foreground);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
    }
    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    @media (min-width: 640px)  { .container { padding: 0 1.5rem; } }
    @media (min-width: 1024px) { .container { padding: 0 2rem; } }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      line-height: 1.2;
      padding: 1.5rem 0;
    }

    /* ── Month navigation bar ── */
    .nav-bar {
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 0;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-icon {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      color: var(--foreground);
      transition: background 0.15s;
      border-radius: 2px;
    }
    .btn-icon:hover:not(:disabled) { background: var(--accent-bg); }
    .btn-icon:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-icon svg { width: 14px; height: 14px; }

    .month-label {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      min-width: 120px;
      text-align: center;
    }

    .btn-text {
      height: 28px;
      padding: 0 0.75rem;
      font-size: 0.625rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: 'DM Sans', sans-serif;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      color: var(--foreground);
      transition: background 0.15s;
      border-radius: 2px;
    }
    .btn-text:hover { background: var(--accent-bg); }

    .btn-refresh {
      margin-left: auto;
    }
    .btn-refresh svg {
      transition: transform 0.6s linear;
    }
    .btn-refresh.spinning svg {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Calendar layout ── */
    .calendar-wrap {
      display: flex;
      padding: 1rem 0;
    }

    /* Frozen left time column */
    .time-col {
      flex-shrink: 0;
      width: 64px;
      background: var(--background);
      z-index: 10;
    }
    .time-corner {
      height: 40px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .time-cell {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-size: 0.625rem;
      letter-spacing: 0.05em;
      color: var(--muted-fg);
    }
    .time-cell.divider-bottom {
      border-bottom: 2px solid var(--border-strong);
    }

    /* Scrollable day grid */
    .grid-scroll {
      overflow-x: auto;
      flex: 1;
      cursor: grab;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .grid-scroll:active { cursor: grabbing; }
    .grid-scroll::-webkit-scrollbar { height: 4px; }
    .grid-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .grid-inner {
      /* width set dynamically by JS */
    }

    /* Day header row */
    .day-header-row {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .day-header-cell {
      width: 44px;
      flex-shrink: 0;
      height: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--border);
    }
    .day-header-cell.sunday-right {
      border-right: 2px solid var(--border-strong);
    }
    .day-name {
      font-size: 0.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted-fg);
      line-height: 1;
    }
    .day-num {
      font-family: 'Playfair Display', serif;
      font-size: 0.75rem;
      margin-top: 2px;
      line-height: 1;
    }
    .day-num.today {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--foreground);
      color: var(--background);
      font-size: 0.625rem;
    }

    /* Hour rows */
    .hour-row {
      display: flex;
    }
    .hour-cell {
      width: 44px;
      flex-shrink: 0;
      height: 28px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      position: relative;
      transition: background 0.1s;
    }
    .hour-cell.sunday-right {
      border-right: 2px solid var(--border-strong);
    }
    .hour-cell.divider-bottom {
      border-bottom: 2px solid var(--border-strong);
    }
    .hour-cell.busy {
      background: var(--busy-light);
      border-left: 2px solid var(--busy);
    }
    .busy-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.5rem;
      letter-spacing: 0.08em;
      color: var(--busy);
      pointer-events: none;
    }
    .hour-cell.loading {
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { background: transparent; }
      50% { background: rgba(0,0,0,0.04); }
    }

    /* ── Legend + timezone note ── */
    .legend {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.625rem;
      color: var(--muted-fg);
      letter-spacing: 0.05em;
    }
    .legend-swatch {
      width: 16px; height: 16px;
      border: 1px solid var(--border);
    }
    .legend-swatch.busy-swatch {
      background: var(--busy-light);
      border-left: 2px solid var(--busy);
    }
    .tz-note {
      margin-left: auto;
      font-size: 0.625rem;
      color: var(--muted-fg);
      letter-spacing: 0.05em;
    }

    /* ── Error banner ── */
    .error-banner {
      border-bottom: 1px solid var(--border);
      background: var(--busy-light);
      padding: 0.6rem 0;
      display: none;
    }
    .error-banner.visible { display: block; }
    .error-text {
      font-size: 0.75rem;
      color: var(--busy);
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <div class="container">
      <h1>Corry 教练工作日历</h1>
    </div>
  </header>

  <!-- ── Error banner ── -->
  <div class="error-banner" id="errorBanner">
    <div class="container">
      <p class="error-text" id="errorText"></p>
    </div>
  </div>

  <!-- ── Month navigation ── -->
  <div class="nav-bar">
    <div class="container">
      <div class="nav-inner">
        <button class="btn-icon" id="btnPrev" aria-label="上个月">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <span class="month-label" id="monthLabel"></span>
        <button class="btn-icon" id="btnNext" aria-label="下个月">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <button class="btn-text" id="btnToday">今天</button>
        <button class="btn-icon btn-refresh" id="btnRefresh" aria-label="刷新日历" title="刷新日历">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Calendar ── -->
  <main class="container">
    <div class="calendar-wrap">
      <!-- Frozen time column -->
      <div class="time-col" id="timeCol">
        <div class="time-corner"></div>
        <!-- hour labels injected by JS -->
      </div>
      <!-- Scrollable grid -->
      <div class="grid-scroll" id="gridScroll">
        <div class="grid-inner" id="gridInner">
          <!-- header + rows injected by JS -->
        </div>
      </div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item">
        <span class="legend-swatch busy-swatch"></span>
        <span>已预定</span>
      </div>
      <div class="legend-item">
        <span class="legend-swatch"></span>
        <span>空闲</span>
      </div>
      <span class="tz-note">时间均为北京时间（UTC+8）</span>
    </div>
  </main>

  <script>
    // ─── Configuration ────────────────────────────────────────────────────────
    // Replace this with your Outlook iCal link
    const ICAL_URL = "https://outlook.live.com/owa/calendar/9d6c99e3-9162-4101-acae-2f405d0fe419/235344d5-9335-4670-8d57-dc356dfe96d6/cid-7D127DB2C9A902D1/calendar.ics";

    // CORS proxy (required for browser to fetch iCal cross-origin)
    // Using a public proxy; you can self-host corsproxy or use your own
    const CORS_PROXY = "https://api.allorigins.win/raw?url=";

    // Display hours 7–22 (labels "7–8" … "22–23")
    const DISPLAY_HOURS = Array.from({ length: 16 }, (_, i) => i + 7);
    const DAY_NAMES = ["日", "一", "二", "三", "四", "五", "六"];
    const MONTH_NAMES_ZH = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];

    // Navigation bounds
    const today = new Date();
    const todayStr = toDateStr(today);
    const minMonth = addMonths(startOfMonth(today), -2);
    const maxMonth = addMonths(startOfMonth(today), 6);

    // ─── State ────────────────────────────────────────────────────────────────
    let currentDate = new Date(today);
    let busyMap = {}; // { "YYYY-MM-DD": Set<number> }
    let isLoading = false;

    // ─── Date helpers ─────────────────────────────────────────────────────────
    function toDateStr(d) {
      return d.toISOString().slice(0, 10);
    }
    function startOfMonth(d) {
      return new Date(d.getFullYear(), d.getMonth(), 1);
    }
    function endOfMonth(d) {
      return new Date(d.getFullYear(), d.getMonth() + 1, 0);
    }
    function addMonths(d, n) {
      const r = new Date(d);
      r.setMonth(r.getMonth() + n);
      return r;
    }
    function isSameMonth(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
    }
    function getDaysInMonth(d) {
      const days = [];
      const start = startOfMonth(d);
      const end = endOfMonth(d);
      const cur = new Date(start);
      while (cur <= end) {
        days.push(new Date(cur));
        cur.setDate(cur.getDate() + 1);
      }
      return days;
    }

    // ─── iCal parsing ─────────────────────────────────────────────────────────
    // Minimal iCal parser — handles VEVENT, DTSTART, DTEND, all-day events,
    // recurring events (RRULE FREQ=WEEKLY), and Beijing timezone conversion.

    function parseIcal(text) {
      // Unfold lines (RFC 5545: CRLF + whitespace = continuation)
      text = text.replace(/\r\n[ \t]/g, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');

      const events = [];
      const blocks = text.split('BEGIN:VEVENT');
      for (let i = 1; i < blocks.length; i++) {
        const block = blocks[i];
        const ev = parseVevent(block);
        if (ev) events.push(ev);
      }
      return events;
    }

    function getLine(block, key) {
      // Match "KEY:" or "KEY;..." at start of line
      const re = new RegExp(`^${key}[;:][^\n]*`, 'm');
      const m = block.match(re);
      return m ? m[0] : null;
    }

    function parseIcalDate(line) {
      // Returns { date: Date, isAllDay: bool }
      if (!line) return null;
      const colonIdx = line.indexOf(':');
      const params = line.slice(0, colonIdx).toUpperCase();
      const value = line.slice(colonIdx + 1).trim();

      // All-day: VALUE=DATE → YYYYMMDD
      if (params.includes('VALUE=DATE') || value.length === 8) {
        const y = parseInt(value.slice(0,4));
        const mo = parseInt(value.slice(4,6)) - 1;
        const d = parseInt(value.slice(6,8));
        return { date: new Date(y, mo, d), isAllDay: true };
      }

      // Timed: YYYYMMDDTHHMMSSZ (UTC) or with TZID
      const basic = value.replace(/[^0-9TZ]/g, '');
      const y = parseInt(basic.slice(0,4));
      const mo = parseInt(basic.slice(4,6)) - 1;
      const d = parseInt(basic.slice(6,8));
      const h = parseInt(basic.slice(9,11)) || 0;
      const min = parseInt(basic.slice(11,13)) || 0;
      const s = parseInt(basic.slice(13,15)) || 0;

      let date;
      if (value.endsWith('Z')) {
        // UTC
        date = new Date(Date.UTC(y, mo, d, h, min, s));
      } else if (params.includes('TZID=CHINA STANDARD TIME') || params.includes('TZID=ASIA/SHANGHAI')) {
        // Already Beijing time — subtract 8h to get UTC, then store as UTC
        date = new Date(Date.UTC(y, mo, d, h - 8, min, s));
      } else if (params.includes('TZID=')) {
        // Unknown timezone — treat as UTC (safe fallback)
        date = new Date(Date.UTC(y, mo, d, h, min, s));
      } else {
        // Floating time — treat as Beijing local
        date = new Date(Date.UTC(y, mo, d, h - 8, min, s));
      }
      return { date, isAllDay: false };
    }

    function parseRrule(line) {
      if (!line) return null;
      const value = line.slice(line.indexOf(':') + 1);
      const parts = {};
      value.split(';').forEach(p => {
        const [k, v] = p.split('=');
        parts[k] = v;
      });
      return parts;
    }

    function parseVevent(block) {
      const dtStartLine = getLine(block, 'DTSTART');
      const dtEndLine   = getLine(block, 'DTEND');
      const rruleLine   = getLine(block, 'RRULE');
      const statusLine  = getLine(block, 'STATUS');
      // NOTE: We intentionally ignore X-MICROSOFT-CDO-BUSYSTATUS.
      // Any event in the calendar (FREE or BUSY) means the time slot is taken.

      if (!dtStartLine) return null;

      // Skip cancelled events only
      if (statusLine && statusLine.toUpperCase().includes('CANCELLED')) return null;

      const startParsed = parseIcalDate(dtStartLine);
      if (!startParsed) return null;

      const endParsed = dtEndLine ? parseIcalDate(dtEndLine) : null;
      const endDate = endParsed ? endParsed.date : new Date(startParsed.date.getTime() + 3600000);

      const rrule = rruleLine ? parseRrule(rruleLine) : null;

      return {
        start: startParsed.date,
        end: endDate,
        isAllDay: startParsed.isAllDay,
        rrule,
      };
    }

    // Convert UTC Date to Beijing date string "YYYY-MM-DD"
    function toBeijingDateStr(utcDate) {
      const bj = new Date(utcDate.getTime() + 8 * 3600 * 1000);
      return bj.toISOString().slice(0, 10);
    }

    // Get Beijing hour (0–23) from UTC Date
    function toBeijingHour(utcDate) {
      return new Date(utcDate.getTime() + 8 * 3600 * 1000).getUTCHours();
    }

    // Expand recurring events (weekly only, up to rangeEnd)
    function expandEvent(ev, rangeStart, rangeEnd) {
      const results = [];
      if (!ev.rrule) {
        results.push({ start: ev.start, end: ev.end, isAllDay: ev.isAllDay });
        return results;
      }
      const rrule = ev.rrule;
      if (rrule.FREQ !== 'WEEKLY') {
        // For non-weekly recurrence, just include the base event if in range
        results.push({ start: ev.start, end: ev.end, isAllDay: ev.isAllDay });
        return results;
      }

      const until = rrule.UNTIL ? parseIcalDate('UNTIL:' + rrule.UNTIL)?.date : null;
      const count = rrule.COUNT ? parseInt(rrule.COUNT) : 500;
      const interval = rrule.INTERVAL ? parseInt(rrule.INTERVAL) : 1;
      const duration = ev.end.getTime() - ev.start.getTime();

      let cur = new Date(ev.start);
      let n = 0;
      while (cur <= rangeEnd && n < count) {
        if (until && cur > until) break;
        if (cur >= rangeStart || new Date(cur.getTime() + duration) > rangeStart) {
          results.push({
            start: new Date(cur),
            end: new Date(cur.getTime() + duration),
            isAllDay: ev.isAllDay,
          });
        }
        cur = new Date(cur.getTime() + interval * 7 * 24 * 3600 * 1000);
        n++;
      }
      return results;
    }

    // Build busyMap for a month from iCal text
    function buildBusyMap(icalText, startDate, endDate) {
      const events = parseIcal(icalText);
      const rangeStart = new Date(startDate + 'T00:00:00+08:00');
      const rangeEnd   = new Date(endDate   + 'T23:59:59+08:00');
      const newMap = {};

      for (const ev of events) {
        const expanded = expandEvent(ev, rangeStart, rangeEnd);
        for (const inst of expanded) {
          if (inst.isAllDay) {
            // All-day: mark the calendar date directly
            // inst.start is a local Date(y, m, d) — use its local date parts
            const cursor = new Date(inst.start);
            while (cursor < inst.end) {
              const dateStr = cursor.toISOString().slice(0, 10);
              if (dateStr >= startDate && dateStr <= endDate) {
                if (!newMap[dateStr]) newMap[dateStr] = new Set();
                for (let h = 7; h <= 22; h++) newMap[dateStr].add(h);
              }
              cursor.setUTCDate(cursor.getUTCDate() + 1);
            }
          } else {
            // Timed: walk UTC hours, convert to Beijing
            if (inst.end <= rangeStart || inst.start >= rangeEnd) continue;
            const cursor = new Date(inst.start);
            cursor.setUTCMinutes(0, 0, 0);
            while (cursor < inst.end) {
              const dateStr = toBeijingDateStr(cursor);
              const hour = toBeijingHour(cursor);
              if (dateStr >= startDate && dateStr <= endDate) {
                if (!newMap[dateStr]) newMap[dateStr] = new Set();
                newMap[dateStr].add(hour);
              }
              cursor.setUTCHours(cursor.getUTCHours() + 1);
            }
          }
        }
      }
      return newMap;
    }

    // ─── Fetch iCal ───────────────────────────────────────────────────────────
    async function fetchIcal() {
      const url = CORS_PROXY + encodeURIComponent(ICAL_URL);
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return resp.text();
    }

    // ─── Render ───────────────────────────────────────────────────────────────
    function renderCalendar() {
      const days = getDaysInMonth(currentDate);
      const startDate = toDateStr(days[0]);
      const endDate   = toDateStr(days[days.length - 1]);

      // Month label
      document.getElementById('monthLabel').textContent =
        `${currentDate.getFullYear()}年 ${MONTH_NAMES_ZH[currentDate.getMonth()]}`;

      // Nav button states
      const curMonthStart = startOfMonth(currentDate);
      document.getElementById('btnPrev').disabled = curMonthStart <= minMonth;
      document.getElementById('btnNext').disabled = curMonthStart >= maxMonth;

      // ── Time column ──
      const timeCol = document.getElementById('timeCol');
      // Remove old hour labels (keep corner)
      while (timeCol.children.length > 1) timeCol.removeChild(timeCol.lastChild);
      for (const hour of DISPLAY_HOURS) {
        const cell = document.createElement('div');
        cell.className = 'time-cell' + (hour === 11 || hour === 17 ? ' divider-bottom' : '');
        cell.textContent = `${hour}–${hour + 1}`;
        timeCol.appendChild(cell);
      }

      // ── Grid ──
      const gridInner = document.getElementById('gridInner');
      gridInner.innerHTML = '';
      gridInner.style.minWidth = (days.length * 44) + 'px';

      // Day header row
      const headerRow = document.createElement('div');
      headerRow.className = 'day-header-row';
      for (const day of days) {
        const isSun = day.getDay() === 0;
        const isT   = toDateStr(day) === todayStr;
        const cell  = document.createElement('div');
        cell.className = 'day-header-cell' + (isSun ? ' sunday-right' : '');
        const nameEl = document.createElement('span');
        nameEl.className = 'day-name';
        nameEl.textContent = DAY_NAMES[day.getDay()];
        const numEl = document.createElement('span');
        numEl.className = 'day-num' + (isT ? ' today' : '');
        numEl.textContent = day.getDate();
        cell.appendChild(nameEl);
        cell.appendChild(numEl);
        headerRow.appendChild(cell);
      }
      gridInner.appendChild(headerRow);

      // Hour rows
      for (const hour of DISPLAY_HOURS) {
        const row = document.createElement('div');
        row.className = 'hour-row';
        for (const day of days) {
          const dateStr = toDateStr(day);
          const isSun = day.getDay() === 0;
          const isBusy = busyMap[dateStr]?.has(hour) ?? false;
          const cell = document.createElement('div');
          let cls = 'hour-cell';
          if (isSun) cls += ' sunday-right';
          if (hour === 11 || hour === 17) cls += ' divider-bottom';
          if (isLoading) cls += ' loading';
          else if (isBusy) cls += ' busy';
          cell.className = cls;
          if (!isLoading && isBusy) {
            const label = document.createElement('span');
            label.className = 'busy-label';
            label.textContent = '已预定';
            cell.appendChild(label);
          }
          row.appendChild(cell);
        }
        gridInner.appendChild(row);
      }
    }

    // ─── Load data ────────────────────────────────────────────────────────────
    async function loadData() {
      if (isLoading) return;
      isLoading = true;
      document.getElementById('btnRefresh').classList.add('spinning');
      document.getElementById('btnRefresh').disabled = true;
      document.getElementById('errorBanner').classList.remove('visible');
      renderCalendar(); // show loading state

      try {
        const text = await fetchIcal();
        const days = getDaysInMonth(currentDate);
        busyMap = buildBusyMap(text, toDateStr(days[0]), toDateStr(days[days.length - 1]));
      } catch (err) {
        document.getElementById('errorText').textContent =
          '无法加载日历数据，请稍后重试。（' + err.message + '）';
        document.getElementById('errorBanner').classList.add('visible');
      } finally {
        isLoading = false;
        document.getElementById('btnRefresh').classList.remove('spinning');
        document.getElementById('btnRefresh').disabled = false;
        renderCalendar();
      }
    }

    // ─── Drag to scroll ───────────────────────────────────────────────────────
    (function() {
      const el = document.getElementById('gridScroll');
      let dragging = false, startX = 0, scrollLeft = 0;
      el.addEventListener('mousedown', e => {
        dragging = true;
        startX = e.pageX - el.offsetLeft;
        scrollLeft = el.scrollLeft;
        el.style.cursor = 'grabbing';
      });
      el.addEventListener('mousemove', e => {
        if (!dragging) return;
        el.scrollLeft = scrollLeft - (e.pageX - el.offsetLeft - startX);
      });
      ['mouseup','mouseleave'].forEach(ev =>
        el.addEventListener(ev, () => { dragging = false; el.style.cursor = 'grab'; })
      );
    })();

    // ─── Event listeners ──────────────────────────────────────────────────────
    document.getElementById('btnPrev').addEventListener('click', () => {
      const cur = startOfMonth(currentDate);
      if (cur > minMonth) {
        currentDate = addMonths(currentDate, -1);
        loadData();
      }
    });
    document.getElementById('btnNext').addEventListener('click', () => {
      const cur = startOfMonth(currentDate);
      if (cur < maxMonth) {
        currentDate = addMonths(currentDate, 1);
        loadData();
      }
    });
    document.getElementById('btnToday').addEventListener('click', () => {
      currentDate = new Date(today);
      loadData();
    });
    document.getElementById('btnRefresh').addEventListener('click', loadData);

    // ─── Init ─────────────────────────────────────────────────────────────────
    loadData();
  </script>
</body>
</html>
