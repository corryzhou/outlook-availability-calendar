name: Refresh Calendar Data

on:
  # Every 15 minutes during Beijing active hours (07:00–00:00 CST = 23:00–16:00 UTC)
  schedule:
    - cron: "*/15 23 * * *"    # UTC 23:xx = Beijing 07:xx
    - cron: "*/15 0-15 * * *"  # UTC 00–15 = Beijing 08:00–23:xx
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push to gh-pages

    steps:
      - name: Checkout main branch (for scripts + package.json)
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout gh-pages branch (deploy target)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: deploy

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ical.js only
        run: |
          mkdir -p /tmp/ical-install && cd /tmp/ical-install
          npm init -y
          npm install ical.js --no-save --ignore-scripts
          cp -r node_modules $GITHUB_WORKSPACE/source/node_modules

      - name: Generate availability.json
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
        run: |
          node source/scripts/generate-availability.mjs > deploy/availability.json
          echo "Generated availability.json ($(wc -c < deploy/availability.json) bytes)"

      - name: Commit and push to gh-pages
        working-directory: deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add availability.json
          if git diff --staged --quiet; then
            echo "No changes to availability.json, skipping commit."
          else
            git commit -m "chore: refresh calendar data [skip ci]"
            git push
            echo "Pushed updated availability.json to gh-pages."
          fi
